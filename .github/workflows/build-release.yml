name: Build and Release Alldesk

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build_type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        build_type: [onedir, onefile]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --locked --group dev

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          uv run pyinstaller Alldesk-${{ matrix.build_type }}.spec
          if ("${{ matrix.build_type }}" -eq "onedir") {
            Set-Location dist
            $target = Get-ChildItem -Directory | Select-Object -First 1 -ExpandProperty Name
            Compress-Archive -Path $target -DestinationPath Alldesk-Windows-onedir.zip -Force
          }

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          uv run pyinstaller Alldesk-${{ matrix.build_type }}.spec
          cd dist
          if [ "${{ matrix.build_type }}" = "onedir" ]; then
            target_dir=$(find . -maxdepth 1 -type d ! -path "." | head -n 1)
            zip -r Alldesk-macOS-onedir.zip "$target_dir"
          else
            target_file=$(find . -maxdepth 1 -type f ! -name "*.zip" | head -n 1)
            zip Alldesk-macOS-onefile.zip "$target_file"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alldesk-${{ matrix.build_type }}-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p final_assets
          find raw_artifacts -type f \( -name "Alldesk-*.zip" -o -name "Alldesk-*.exe" \) -exec cp {} final_assets/ \;
          ls -lh final_assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: final_assets/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
